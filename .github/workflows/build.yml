name: Build Lamnian APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check google-services.json is present
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Download it from Firebase (Project settings > Your apps > Android) and upload it to the app folder."
            exit 1
          fi

      - name: Check google-services.json matches the signing key
        run: |
          SHA1=$(keytool -list -v -keystore app/lamnian.keystore -storepass lamnian123 2>/dev/null | grep 'SHA1:' | head -1 | sed 's/.*SHA1: //' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "Signing key SHA-1: $SHA1"
          if grep -qi "$SHA1" app/google-services.json; then
            echo "OK: this SHA-1 is registered in google-services.json (Google sign-in will work)."
          else
            echo "::warning::The signing key SHA-1 ($SHA1) is not in google-services.json. Add it in Firebase (Project settings > Android app > Add fingerprint), download google-services.json again and replace app/google-services.json, or Google sign-in will fail."
          fi

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Lamnian-APK
          path: app/build/outputs/apk/release/*.apk
